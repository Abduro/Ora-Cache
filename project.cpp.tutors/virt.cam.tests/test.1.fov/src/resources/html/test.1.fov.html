<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=windows-1252"/>
	<link rel="stylesheet" type="text/css" href="test.1.fov.css"/>
	<meta http-equiv="X-UA-Compatible" content="content=IE=edge,chrome=1" /><!-- Crucial for IWebBrowser2 to enable HTML5, SVG, and CSS3 -->

	<script type="text/javascript">
		/* https://stackoverflow.com/questions/33811677/html-canvas-draw-a-circle-on-mouse-click-and-drag-it-untill-the-required-radius << doesn't works;*/
		var isDragging = false;
		var offsetX, offsetY;

		function On_mouse_down (e) {
			isDragging = true;
			// calculates click offset relative to the image top-left;
			var img = document.getElementById('the_monitor');
			if (img){
				offsetX = e.clientX - img.offsetLeft;
				offsetY = e.clientY - img.offsetTop;
				Set_stat_message("On_mouse_down event occurred;");
			}
			e.preventDefault(); // prevents default drag-and-drop ghost image;
		}

		function On_mouse_move (e) {
			if (!isDragging) return;
			var img = document.getElementById('the_monitor');
			if (img){
				img.style.left = (e.clientX - offsetX) + 'px';
				img.style.top = (e.clientY - offsetY) + 'px';
				Set_stat_message("On_mouse_move event occurred;");
			}
			if (window.external && window.external.RefreshUI) {
				window.external.RefreshUI();
			}
		}

		function On_mouse_up (e) {
			isDragging = false;
			Set_stat_message("On_mouse_up event occurred;");
		}

		document.addEventListener('mousedown', On_mouse_down);
		document.addEventListener('mousemove', On_mouse_move);
		document.addEventListener('mouseup'  , On_mouse_up);

		function Set_stat_message (_msg_text) {
			var status_bar = document.getElementById("status_bar");
			if (status_bar){
				status_bar.innerHTML = _msg_text;
			}
		}
	</script>
	<style>
		:root {
			--status-bar-height: 24px;
			--status-bar-color : #3f4448;
		}

		html, body {
			width   : 100%;
			height  : 100%;
			margin  :   0 ;   /* Removes default browser margins */
			overflow: hidden; /* optional, depending on your layout */
			padding-bottom: var(--status-bar-height); /* MATCH THIS to the exact height of your status bar */
		}

		.centered-div {
			position: absolute;
			top     : 50%;
			left    : 50%;
			width   : 192px;     /* Set your exact image/div width */
			height  :  64px;     /* Set your exact image/div height */
			margin-top : -32px; /* Half of height */
			margin-left: -96px; /* Half of width  */
		}

		.centered-div img {
			display : block;
			width   : 100%;
			height  : 100%;
		}

		#the_monitor {
			position: absolute;
			cursor  : move;
			user-select: none;
		-webkit-user-select: none;
		}

		.status-bar {
			/* Layout alignment inside the status bar */
			display         : flex;
			display         : -ms-flexbox;    /* IE11 prefix */
			/* Layers it on top of other content and prevents text selection */
			z-index         : 9999; 
			user-select     : none;
			/* Visual styles*/
			background-color: #fff;
			color           : var(--status-bar-color);
			font-family     : verdana, sans-serif;
			font-size       : 12px;
			border-top      : 1px solid #CDCDCD;
		}
		.status-bar-align {
			-ms-flex-align  : center;     /* IE11 vertical center alignment */
			align-items     : left;
			padding         : 5 0 5 5px;  /* top, right, bottom, left */
			box-sizing      : border-box; /* Ensures padding doesn't break the 100% width */
		}
		.status-bar-pos {
			position        : fixed;
			bottom          : 0;
			left            : 0;
			width           : 100%;
			height          : var(--status-bar_height);
		}
	</style>

</head>
<body id = "this_page">

	<div class="centered-div" id = "the_holder">
		<img id = "the_monitor" src = "test.1.fov.monitor.png" alt = "This is the monitor image" title = "This is the target of a distance." />
	</div>
	<div class="status-bar status-bar-align status-bar-pos" id = "status_bar">

	</div>
